services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - datalens_media:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  cleanup:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - datalens_media:/app/media
    command: python manage.py cleanup_datasets --watch
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  datalens_media:
  frontend_node_modules: